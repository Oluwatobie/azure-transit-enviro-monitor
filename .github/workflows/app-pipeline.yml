name: Deploy Leicester Monitor

# Triggers ONLY when code is pushed or merged into the MAIN branch
on:
  push:
    branches: [ "main" ]

# This is REQUIRED for Passwordless OIDC authentication
permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME: ${{ github.repository_owner }}/leics-monitor
  RESOURCE_GROUP: rg-leics-monitor
  CONTAINER_APP: ca-leics-monitor

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Automatically grabs your username, downcases it, 
      # and registers it as $IMAGE_NAME for all subsequent steps
      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/leics-monitor" >> $GITHUB_ENV

      # 1. Login to Azure Passwordlessly
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2. Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_REGISTRY_PASSWORD }}

      # 3. Build and Push the Docker Container
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 4. Deploy the new image to Azure Container Apps
      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}